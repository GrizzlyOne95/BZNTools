[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bzr-odf-checker"
version = "0.1.0"
description = "Code/stock-contract-backed ODF checker for Battlezone 98 Redux"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
odfcheck = "odfcheck.checker:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
