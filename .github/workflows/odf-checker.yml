name: ODF Checker

on:
  push:
    paths:
      - "ODFChecker/**"
      - ".github/workflows/odf-checker.yml"
  pull_request:
    paths:
      - "ODFChecker/**"
      - ".github/workflows/odf-checker.yml"

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run regression tests
        env:
          PYTHONPATH: ODFChecker/src
        run: python -m unittest discover -s ODFChecker/tests -v

      - name: Dependency-free CLI smoke test
        run: python ODFChecker/odfcheck.py --help
